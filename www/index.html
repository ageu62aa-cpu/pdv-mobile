<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV Mobile</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Animações customizadas para os Modais -->
    <style>
        @keyframes scaleUp {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .animate-scaleUp {
            animation: scaleUp 0.15s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans min-h-screen flex flex-col">

    <!-- BARRA SUPERIOR (HEADER) -->
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-emerald-600 text-white rounded-xl">
                <i class="fa-solid fa-store text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-900 text-base leading-tight">PDV Mobile</h1>
                <span class="text-xs text-slate-500 font-medium">Caixa / Operação</span>
            </div>
        </div>

        <!-- Ações de Navegação para Modais -->
        <nav class="flex items-center space-x-2">
            <button onclick="window.abrirModalProduto()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition flex items-center gap-2">
                <i class="fa-solid fa-box text-emerald-600"></i>
                <span>Novo Produto</span>
            </button>

            <button onclick="window.abrirModalSuperAdmin()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition flex items-center gap-2">
                <i class="fa-solid fa-user-gear text-amber-600"></i>
                <span>Super Admin</span>
            </button>

            <button onclick="window.abrirModalCheckout(150.00)" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold shadow-md transition flex items-center gap-2">
                <i class="fa-solid fa-cash-register"></i>
                <span>Finalizar Venda</span>
            </button>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL (PDV) -->
    <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
        <div class="bg-white rounded-2xl p-8 border border-slate-200 shadow-sm text-center">
            <h2 class="text-xl font-bold text-slate-800 mb-2">Painel de Operações</h2>
            <p class="text-xs text-slate-500 max-w-md mx-auto">
                O HTML inicial está limpo. Todos os modais são injetados dinamicamente sob demanda.
            </p>
        </div>
    </main>

    <!-- CONTÊINER ÚNICO PARA INJEÇÃO DINÂMICA DE MODAIS -->
    <div id="containerModaisDinamicos"></div>

    <!-- SCRIPT PRINCIPAL (Aponta para o seu www/main.js) -->
    <script type="module" src="./main.js"></script>
</body>
</html>
