<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111827">
    <title>Vancely Software - Redirecionando...</title>
</head>
<body>
    <p>A carregar o sistema...</p>
    <script>
        // Regista o Service Worker antes de redirecionar
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker registado com sucesso na raiz:', reg.scope))
                .catch(err => console.error('Erro ao registar Service Worker:', err));
        }

        // Redireciona para o login após um breve instante para garantir o registo
        setTimeout(() => {
            window.location.href = "modules/auth/auth.html";
        }, 300);
    </script>
</body>
</html>
