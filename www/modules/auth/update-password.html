<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vancely Software - Redefinir Senha</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl shadow-2xl w-full max-w-md p-8 flex flex-col items-center">
        
        <!-- Mascote -->
        <div class="mb-4">
            <img src="../../assets/mascote.jpeg" alt="Mascote Vancely" class="w-20 h-20 rounded-full object-cover border-2 border-emerald-500 shadow-lg">
        </div>

        <h1 class="text-xl font-extrabold text-white text-center">Nova Senha</h1>
        <p class="text-xs text-gray-400 mb-6 text-center">Digite a sua nova senha de acesso ao PDV</p>

        <!-- Formulário de Atualização -->
        <form id="form-update-password" class="w-full flex flex-col gap-4">
            <div>
                <label class="text-xs font-bold text-gray-300 uppercase">Nova Senha</label>
                <input type="password" id="nova-senha" required class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2.5 text-white text-sm focus:border-emerald-500 focus:outline-none" placeholder="********">
            </div>

            <button type="submit" class="mt-2 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm transition-colors shadow-lg">
                Atualizar Senha
            </button>
        </form>

        <div id="feedback-msg" class="mt-3 text-center text-xs font-medium hidden"></div>
    </div>

    <!-- Script de Integração com o Supabase -->
    <script type="module">
        import { supabase } from '../../core/config.js';

        const form = document.getElementById('form-update-password');
        const inputNovaSenha = document.getElementById('nova-senha');
        const feedback = document.getElementById('feedback-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const novaSenha = inputNovaSenha.value;

            const { data, error } = await supabase.auth.updateUser({
                password: novaSenha
            });

            feedback.classList.remove('hidden');
            if (error) {
                feedback.className = "mt-3 text-center text-xs font-medium text-rose-400 bg-rose-950/40 p-2 rounded-lg border border-rose-500/30";
                feedback.innerText = "Erro ao atualizar: " + error.message;
            } else {
                feedback.className = "mt-3 text-center text-xs font-medium text-emerald-400 bg-emerald-950/40 p-2 rounded-lg border border-emerald-500/30";
                feedback.innerText = "Senha alterada com sucesso! Redirecionando...";
                setTimeout(() => {
                    window.location.href = 'auth.html';
                }, 2000);
            }
        });
    </script>
</body>
</html>
