<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV Mobile - Login</title>
    <!-- Tailwind CSS para estilização rápida e moderna com verde esmeralda -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emeraldPrimary: '#047857',
                        emeraldHover: '#065f46',
                        emeraldLight: '#10b981',
                        emeraldBg: '#ecfdf5'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-emeraldBg min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 flex flex-col items-center relative overflow-hidden">
        
        <!-- Mascote com função de Hard Refresh -->
        <div class="cursor-pointer mb-2 text-center" id="mascote-container" title="Clique para atualizar o app">
            <img src="../../assets/mascote.jpeg" alt="Mascote" class="w-24 h-24 rounded-full object-cover border-4 border-emeraldPrimary shadow-md mx-auto">
        </div>

        <!-- Gatilho Oculto para Super Admin -->
        <p id="trigger-super-admin" class="text-xs text-gray-400 font-medium mb-6 cursor-pointer select-none hover:text-gray-600 transition-colors">
            Vancely Software Enterprise
        </p>

        <!-- Formulário de Login Principal -->
        <form id="login-form" class="w-full flex flex-col space-y-4">
            <h1 class="text-2xl font-bold text-gray-800 text-center mb-2">Entrar no PDV</h1>
            
            <div class="flex flex-col">
                <label class="text-sm font-semibold text-gray-700 mb-1">E-mail</label>
                <input type="email" id="login-email" required placeholder="seu@email.com" 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emeraldPrimary transition-all">
                <span id="error-email" class="text-xs text-red-500 mt-1 hidden"></span>
            </div>

            <div class="flex flex-col">
                <label class="text-sm font-semibold text-gray-700 mb-1">Senha</label>
                <input type="password" id="login-password" required placeholder="********" 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emeraldPrimary transition-all">
                <span id="error-password" class="text-xs text-red-500 mt-1 hidden"></span>
            </div>

            <div class="flex items-center justify-between text-sm">
                <button type="button" id="btn-forgot-password" class="text-emeraldPrimary hover:underline font-medium">Esqueci minha senha</button>
            </div>

            <button type="submit" class="w-full bg-emeraldPrimary hover:bg-emeraldHover text-white font-bold py-3 rounded-lg shadow-lg transition-colors">
                Fazer Login
            </button>
        </form>

        <!-- Botão para abrir Modal de Cadastro -->
        <div class="mt-6 text-center border-t border-gray-100 pt-4 w-full">
            <p class="text-sm text-gray-600">Não tem uma conta?</p>
            <button id="btn-open-register" class="mt-2 text-emeraldPrimary font-bold hover:underline">
                Cadastrar Nova Empresa
            </button>
        </div>
    </div>

    <!-- Modal de Cadastro de Nova Empresa -->
    <div id="modal-register" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 my-8 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-xl font-bold text-gray-800">Cadastrar Nova Empresa</h2>
                <button id="btn-close-register" class="text-gray-500 hover:text-gray-700 font-bold text-xl">&times;</button>
            </div>

            <form id="register-form" class="space-y-4">
                <div>
                    <label class="text-sm font-semibold text-gray-700">Nome Completo do Responsável</label>
                    <input type="text" id="reg-nome" required class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emeraldPrimary">
                </div>
                <div>
                    <label class="text-sm font-semibold text-gray-700">Nome da Empresa (Razão Social / Fantasia)</label>
                    <input type="text" id="reg-empresa" required class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emeraldPrimary">
                </div>
                <div>
                    <label class="text-sm font-semibold text-gray-700">CNPJ</label>
                    <input type="text" id="reg-cnpj" required placeholder="00.000.000/0001-00" class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emeraldPrimary">
                </div>
                <div>
                    <label class="text-sm font-semibold text-gray-700">E-mail de Acesso</label>
                    <input type="email" id="reg-email" required class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emeraldPrimary">
                </div>
                <div>
                    <label class="text-sm font-semibold text-gray-700">Senha de Acesso</label>
                    <input type="password" id="reg-password" required class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emeraldPrimary">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-sm font-semibold text-gray-700">CEP</label>
                        <input type="text" id="reg-cep" required placeholder="00000-000" maxlength="9" class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emeraldPrimary">
                    </div>
                    <div>
                        <label class="text-sm font-semibold text-gray-700">Cidade / Estado</label>
                        <input type="text" id="reg-cidade-estado" readonly placeholder="Preenchimento automático" class="w-full mt-1 px-3 py-2 border bg-gray-50 text-gray-500 rounded-lg">
                    </div>
                </div>

                <div class="bg-emerald-50 p-3 rounded-lg text-xs text-emerald-800">
                    <p class="font-bold">Plano Comum Enterprise Inicial:</p>
                    <p>• 15 dias de histórico e recursos liberados.</p>
                    <p>• Limite de até 1.000 produtos cadastrados.</p>
                    <p>• Permite cadastrar 1 Administrador e 1 Operador.</p>
                </div>

                <div class="flex space-x-3 pt-2">
                    <button type="button" id="btn-cancel-register" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-700 font-bold py-2 rounded-lg transition-colors">Voltar</button>
                    <button type="submit" class="w-1/2 bg-emeraldPrimary hover:bg-emeraldHover text-white font-bold py-2 rounded-lg shadow transition-colors">Criar Novo Login Enterprise</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Autenticação -->
    <script type="module" src="auth.js"></script>
</body>
</html>
