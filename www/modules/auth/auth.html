<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vancely Software - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emeraldPrimary: '#047857',
                        emeraldHover: '#065f46',
                        emeraldLight: '#10b981',
                        emeraldBg: '#ecfdf5'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-gray-800 border border-gray-700 rounded-2xl shadow-2xl w-full max-w-md p-8 flex flex-col items-center">
        
        <!-- Mascote com Hard Refresh -->
        <div class="cursor-pointer mb-4 group" id="mascote-container" title="Clique para atualizar o sistema">
            <img src="../../assets/mascote.jpeg" alt="Mascote Vancely" class="w-20 h-20 rounded-full object-cover border-2 border-emerald-500 shadow-lg group-hover:scale-105 transition-transform">
        </div>

        <!-- Título com Gatilho Secreto para Super Admin -->
        <h1 id="gatilho-super-admin" class="text-xl font-extrabold text-white text-center cursor-pointer select-none">
            Vancely Software Enterprise
        </h1>
        <p class="text-xs text-gray-400 mb-6 text-center">Painel de Autenticação e Gestão PDV</p>

        <!-- Formulário de Login -->
        <form id="form-login" class="w-full flex flex-col gap-4">
            <div>
                <label class="text-xs font-bold text-gray-300 uppercase">E-mail de Acesso</label>
                <input type="email" id="login-email" required class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2.5 text-white text-sm focus:border-emerald-500 focus:outline-none" placeholder="seu.email@empresa.com">
            </div>

            <div>
                <div class="flex justify-between items-center">
                    <label class="text-xs font-bold text-gray-300 uppercase">Senha</label>
                    <button type="button" id="btn-esqueceu-senha" class="text-[11px] text-emerald-400 hover:underline">Esqueceu a senha?</button>
                </div>
                <input type="password" id="login-senha" required class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2.5 text-white text-sm focus:border-emerald-500 focus:outline-none" placeholder="********">
            </div>

            <button type="submit" class="mt-2 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm transition-colors shadow-lg">
                Acessar Sistema
            </button>
        </form>

        <!-- Botão para abrir o Modal de Cadastro de Nova Empresa -->
        <div class="mt-6 border-t border-gray-700 pt-4 w-full text-center">
            <p class="text-xs text-gray-400">Ainda não tem uma conta?</p>
            <button id="btn-abrir-cadastro" class="mt-2 text-emerald-400 hover:text-emerald-300 text-xs font-bold underline transition-colors">
                Cadastrar Nova Empresa (Tenant)
            </button>
        </div>

    </div>

    <!-- Modal de Cadastro de Nova Empresa (ViaCEP integrado) -->
    <div id="modal-cadastro" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl shadow-2xl w-full max-w-lg p-6 text-gray-100 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-3">
                <h3 class="text-lg font-bold text-white">Cadastrar Nova Empresa (Plano Comum)</h3>
                <button id="modal-close-btn" class="text-gray-400 hover:text-white font-bold text-xl">&times;</button>
            </div>
            
            <form id="form-cadastro-empresa" class="space-y-3">
                <div>
                    <label class="text-xs font-bold text-gray-300 uppercase">Razão Social / Nome da Empresa</label>
                    <input type="text" id="cad-nome-empresa" required class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs font-bold text-gray-300 uppercase">CNPJ</label>
                        <input type="text" id="cad-cnpj" required class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm" placeholder="00.000.000/0001-00">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-300 uppercase">CEP</label>
                        <input type="text" id="cad-cep" required maxlength="9" class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm" placeholder="69000-000">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs font-bold text-gray-300 uppercase">Cidade</label>
                        <input type="text" id="cad-cidade" required class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm bg-gray-800" readonly>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-300 uppercase">Estado (UF)</label>
                        <input type="text" id="cad-estado" required class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm bg-gray-800" readonly>
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-300 uppercase">Nome do Responsável</label>
                    <input type="text" id="cad-responsavel" required class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-300 uppercase">E-mail de Acesso (Real)</label>
                    <input type="email" id="cad-email" required class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm" placeholder="admin@suaempresa.com">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-300 uppercase">Senha Provisória</label>
                    <input type="password" id="cad-senha" required class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm" placeholder="Mínimo 6 caracteres">
                </div>

                <div class="pt-3">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm transition-colors">
                        Concluir Cadastro (15 dias de teste)
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Autenticação e Gatilhos -->
    <script type="module" src="auth.js"></script>
</body>
</html>
