<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vancely Software - Frente de Caixa (Operador)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Topo / Header do Operador (SEM o botão de admin) -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-emerald-600 shadow-md flex items-center justify-center bg-white">
                <img src="../../assets/caixa.registradora.jpeg" alt="Caixa Registradora" class="w-14 h-14 object-cover scale-125">
            </div>
            <div>
                <h1 class="font-bold text-sm text-white tracking-wide">Vancely Software - Frente de Caixa</h1>
                <p id="txtStatusCaixaHeader" class="text-xs text-amber-400 font-semibold flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Caixa Fechado (Necessário Abertura)
                </p>
            </div>
        </div>

        <!-- Botões de Gestão de Caixa e Sair -->
        <div class="flex items-center gap-2">
            <button onclick="window.acionarAbrirCaixa()" id="btnAbrirCaixaHeader" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-lg text-xs font-bold transition shadow flex items-center gap-2">
                <i class="fa-solid fa-unlock"></i> Abrir Caixa
            </button>
            <button onclick="window.acionarFecharCaixa()" id="btnFecharCaixaHeader" class="bg-red-600/80 hover:bg-red-600 text-white px-3.5 py-2 rounded-lg text-xs font-bold transition shadow flex items-center gap-2">
                <i class="fa-solid fa-lock"></i> Fechar Caixa
            </button>
            <div class="h-6 w-px bg-gray-700 mx-1"></div>
            <span id="txtInfoOperador" class="text-xs text-gray-400">Operador: <strong class="text-gray-200">Ativo</strong></span>
            
            <button onclick="window.location.href='../auth/auth.html'" class="bg-red-900/50 hover:bg-red-900 text-red-200 px-3 py-2 rounded-lg text-xs font-bold transition border border-red-800">Sair</button>
        </div>
    </header>

    <!-- Corpo Principal idêntico ao caixa-core.html -->
    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 overflow-hidden">
        <!-- Coluna Esquerda & Centro: Busca e Lista de Produtos -->
        <section class="lg:col-span-2 flex flex-col gap-4 overflow-hidden">
            <div id="containerCaixaBusca" class="w-full bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-700 flex flex-col gap-2 relative">
                <div class="flex items-center justify-between">
                    <label for="inputBusca" class="text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center gap-1.5">
                        PESQUISA / CÓDIGO DE BARRAS <span class="text-emerald-400 font-mono">(F5)</span>
                    </label>
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-emerald-400 font-semibold flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Leitor Ativo
                        </span>
                    </div>
                </div>
                <div class="relative flex items-center">
                    <input type="text" id="inputBusca" placeholder="Escaneie o código de barras ou digite o nome do produto..." autocomplete="off" class="w-full px-4 py-3 pl-10 bg-gray-900 border border-gray-700 rounded-lg text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                </div>
                <!-- Caixa de Sugestões -->
                <div id="sugestoesBusca" class="absolute left-0 right-0 top-full mt-1 bg-gray-900 border border-gray-700 rounded-lg shadow-xl z-50 hidden max-h-60 overflow-y-auto"></div>
            </div>

            <!-- Tabela de Itens da Venda -->
            <div class="flex-1 bg-gray-800 border border-gray-700 rounded-xl p-4 flex flex-col overflow-hidden shadow-sm">
                <div class="overflow-y-auto flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="text-xs text-gray-400 border-b border-gray-700">
                                <th class="py-2 px-3">Item</th>
                                <th class="py-2 px-3">Qtd</th>
                                <th class="py-2 px-3">Preço Unit.</th>
                                <th class="py-2 px-3">Total</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaItensVenda" class="text-sm">
                            <!-- Itens injetados dinamicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Coluna Direita: Totais e Pagamento -->
        <section class="bg-gray-800 border border-gray-700 rounded-xl p-5 flex flex-col justify-between shadow-sm">
            <div class="flex flex-col gap-4">
                <h2 class="text-sm font-bold text-gray-300 uppercase tracking-wide border-b border-gray-700 pb-2">Resumo da Venda</h2>
                <div class="flex justify-between items-center bg-gray-900 p-4 rounded-xl border border-gray-700">
                    <span class="text-xs text-gray-400 font-bold uppercase">Total a Pagar</span>
                    <span id="txtTotalVenda" class="text-2xl font-black text-emerald-400">R$ 0,00</span>
                </div>
            </div>
            <div class="flex flex-col gap-2">
                <button onclick="window.acionarFinalizarVenda()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check"></i> Finalizar Venda
                </button>
            </div>
        </section>
    </main>

    <!-- Script Principal do PDV Reutilizado Diretamente -->
    <script type="module" src="caixa-core.js"></script>
</body>
</html>
