<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="../../assets/pwa-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/pwa-192.png">
    <title>Vancely Software - Painel Administrativo</title>
    <script src="../../pwa.js" defer></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #adminHeaderActions {
            flex: 0 0 auto;
            white-space: nowrap;
        }

        #adminHeaderActions [data-open-plans-tab],
        #adminHeaderActions #btnPWAAction {
            width: auto;
            min-width: 2.5rem;
            height: 2.5rem;
            padding: 0 0.75rem;
            flex: 0 0 auto;
            white-space: nowrap;
        }

        #adminHeaderActions [data-return-to-cash-register] {
            width: 2.25rem;
            height: 2.25rem;
            padding: 0;
            flex: 0 0 2.25rem;
        }

        #adminHeaderActions [data-return-to-cash-register] .action-label {
            display: none;
        }

        @media (max-width: 640px) {
            #adminHeader {
                gap: 0.5rem;
                padding: 0.5rem;
            }

            #adminBrand {
                min-width: 0;
                gap: 0.4rem;
                flex: 1 1 auto;
            }

            #adminBrand img {
                width: 2rem;
                height: 2rem;
            }

            #adminBrand h1 {
                max-width: 9rem;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 0.65rem;
            }

            #adminHeaderActions {
                gap: 0.3rem;
            }

            #adminHeaderActions a,
            #adminHeaderActions button {
                flex: 0 0 2.25rem;
                width: 2.25rem;
                height: 2.25rem;
                padding: 0;
                justify-content: center;
            }

            #adminHeaderActions .action-label {
                display: none;
            }

            #adminHeaderActions [data-open-plans-tab],
            #adminHeaderActions #btnPWAAction {
                width: 2.25rem;
                min-width: 2.25rem;
                height: 2.25rem;
                padding: 0;
            }

            #adminLayout {
                padding: 0.5rem;
                gap: 0.5rem;
            }

            #adminTabs {
                padding: 0.4rem;
                gap: 0.25rem;
            }

            #adminTabs .tab-btn {
                padding: 0.45rem 0.6rem;
                font-size: 0.65rem;
                white-space: nowrap;
            }

            #admin-conteudo-dinamico {
                padding: 0.75rem;
            }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col overflow-x-hidden">

    <!-- Cabeçalho do Admin -->
    <header id="adminHeader" class="bg-gray-800 border-b border-gray-700 px-6 py-3 flex justify-between items-center shadow-md">
        <div id="adminBrand" class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-emerald-600 shadow-md flex items-center justify-center bg-white">
                <img src="../../assets/botao-admin.jpeg" alt="Admin" class="w-14 h-14 object-cover scale-125">
            </div>
            <div>
                <h1 class="font-bold text-sm text-white tracking-wide">Vancely Software - Painel Administrativo</h1>
                <p class="text-xs text-emerald-400 font-semibold flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Sistema Operacional Online
                </p>
            </div>
        </div>
        <div id="adminHeaderActions" class="flex items-center gap-3">
            <button type="button" data-open-plans-tab aria-label="Meu plano" title="Planos e assinatura" class="bg-amber-600 hover:bg-amber-500 text-white rounded-lg font-bold transition-colors shadow flex items-center justify-center gap-2">
                <i class="fa-solid fa-crown" aria-hidden="true"></i>
                <span class="action-label text-xs">Meu plano</span>
            </button>
            <button type="button" data-return-to-cash-register aria-label="Voltar ao caixa" title="Voltar ao caixa" class="flex items-center justify-center rounded-lg border border-gray-600 bg-gray-700 text-gray-200 transition hover:border-emerald-600 hover:bg-gray-600 hover:text-white">
                <i class="fa-solid fa-arrow-left-long" aria-hidden="true"></i>
            </button>
            <a href="../auth/auth.html" aria-label="Sair" title="Sair" class="bg-red-900/50 hover:bg-red-900 text-red-200 w-9 h-9 rounded-lg font-bold transition-colors border border-red-800 flex items-center justify-center">
                <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
            </a>
        </div>
    </header>

    <!-- Conteúdo Principal com Abas -->
    <main id="adminLayout" class="flex-1 max-w-7xl mx-auto w-full p-6 flex flex-col md:flex-row gap-6">
        <!-- Menu Lateral de Abas -->
        <aside id="adminTabs" class="w-full md:w-64 bg-gray-800 border border-gray-700 rounded-xl p-3 h-fit flex flex-row md:flex-col gap-1.5 overflow-x-auto shadow-sm">
            <button data-tab="produtos" class="tab-btn text-left px-4 py-3 rounded-lg text-xs font-bold bg-emerald-600 text-white transition-colors flex items-center gap-2 shadow">
                <i class="fa-solid fa-boxes-stacked w-4"></i> Produtos e Estoque
            </button>
            <button data-tab="operadores" class="tab-btn text-left px-4 py-3 rounded-lg text-xs font-medium text-gray-300 hover:bg-gray-750 hover:text-white transition-colors flex items-center gap-2">
                <i class="fa-solid fa-users w-4"></i> Operadores (Caixa)
            </button>
            <button data-tab="maquininhas" class="tab-btn text-left px-4 py-3 rounded-lg text-xs font-medium text-gray-300 hover:bg-gray-750 hover:text-white transition-colors flex items-center gap-2">
                <i class="fa-solid fa-credit-card w-4"></i> Maquininhas de Cartão
            </button>
            <button data-tab="historico" class="tab-btn text-left px-4 py-3 rounded-lg text-xs font-medium text-gray-300 hover:bg-gray-750 hover:text-white transition-colors flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left w-4"></i> Histórico de Vendas
            </button>
            <button data-tab="planos" class="tab-btn text-left px-4 py-3 rounded-lg text-xs font-medium text-gray-300 hover:bg-gray-750 hover:text-white transition-colors flex items-center gap-2">
                <i class="fa-solid fa-crown w-4"></i> Planos &amp; Assinatura
            </button>
            <button data-tab="configuracoes" class="tab-btn text-left px-4 py-3 rounded-lg text-xs font-medium text-gray-300 hover:bg-gray-750 hover:text-white transition-colors flex items-center gap-2">
                <i class="fa-solid fa-shield-halved w-4"></i> Segurança do Caixa
            </button>
        </aside>

        <!-- Área Dinâmica de Exibição (Fundo Escuro Ajustado) -->
        <section id="admin-conteudo-dinamico" class="flex-1 bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-sm">
            <!-- Os módulos serão injetados aqui via admin-core.js -->
        </section>
    </main>

    <footer class="mx-auto w-full max-w-7xl px-6 pb-4 text-center text-[11px] text-gray-500">
        <a href="../../termos.html" class="underline hover:text-emerald-400">Termos de Uso e Política de Privacidade</a>
    </footer>

    <!-- Script Cor do Admin -->
    <script type="module" src="admin-core.js"></script>
</body>
</html>
