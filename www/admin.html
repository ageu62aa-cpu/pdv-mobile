<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV Mobile - Painel Administrativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Cabeçalho do Admin -->
    <header class="bg-emerald-800 text-white shadow-md p-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <h1 class="font-bold text-base">Painel Administrativo</h1>
        </div>
        <div class="flex items-center gap-3">
            <a href="../pdv/components/caixa-core.js" class="bg-emerald-700 hover:bg-emerald-600 text-xs px-3 py-1.5 rounded-lg font-medium transition-colors">Voltar ao Caixa</a>
            <a href="../auth/auth.html" class="bg-red-600 hover:bg-red-700 text-xs px-3 py-1.5 rounded-lg font-medium transition-colors">Sair</a>
        </div>
    </header>

    <!-- Conteúdo Principal com Abas -->
    <main class="flex-1 max-w-7xl mx-auto w-full p-4 flex flex-col md:flex-row gap-4">
        <!-- Menu Lateral de Abas -->
        <aside class="w-full md:w-64 bg-white rounded-2xl shadow-sm border border-gray-100 p-3 h-fit flex flex-row md:flex-col gap-1 overflow-x-auto">
            <button data-tab="produtos" class="tab-btn text-left px-4 py-2.5 rounded-xl text-sm font-bold bg-emerald-50 text-emerald-800 transition-colors">Produtos e Estoque</button>
            <button data-tab="operadores" class="tab-btn text-left px-4 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors">Operadores (Caixa)</button>
            <button data-tab="maquininhas" class="tab-btn text-left px-4 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors">Maquininhas de Cartão</button>
            <button data-tab="historico" class="tab-btn text-left px-4 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors">Histórico de Vendas</button>
        </aside>

        <!-- Área Dinâmica de Exibição -->
        <section id="admin-conteudo-dinamico" class="flex-1 bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <!-- Os módulos serão injetados aqui via admin-core.js -->
        </section>
    </main>

    <!-- Script Cor do Admin -->
    <script type="module" src="admin-core.js"></script>
</body>
</html>
